name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      fixtures:
        description: "Also compare every fixture with OpenSCAD's own render (slow)"
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: convert a file end to end
        run: |
          node dist/cli.mjs __fixtures__/cube-hole.scad -o cube-hole.step
          head -c 200 cube-hole.step | grep -q "ISO-10303-21"

  fixtures:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.fixtures }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run test:fixtures
